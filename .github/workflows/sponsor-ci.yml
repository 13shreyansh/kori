name: CRACI project checks
on:
  push:
    branches: [main, parallax, claude/rebuild, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: craci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: craci
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - run: npm ci --prefix app
      - run: npm --prefix app run generate
      - run: npm --prefix app test
      - run: npm --prefix app run lint
      - run: npm --prefix app run build
      - run: node --test app/scripts/gemma-router.test.mjs
